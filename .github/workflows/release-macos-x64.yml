# Builds LoCoPilot for macOS Intel (x64) by cross-compiling on an Apple Silicon
# runner (macos-14). Produces an UNSIGNED .dmg. Mirrors Docs/BUILD_COMMANDS.md §1.
#
# Why cross-compile: GitHub is retiring the Intel `macos-13` runner. VS Code builds
# its Intel app on Apple Silicon by running the build as x86_64 (under Rosetta) with
# an x64 Node, so native modules both BUILD and LOAD as x64. We do the same here.
name: Build macOS x64

# Manual trigger only. See Docs/CI_BUILDS.md.
#   gh workflow run "Build macOS x64" --repo BixbiteAI/LoCoPilot --ref main
on:
  workflow_dispatch:

# Pins the bundled llama.cpp engine for EVERY job in this workflow. Each release workflow invokes
# scripts/fetch-llama-binaries.mjs separately, so without one shared value the platforms can resolve
# different 'latest' tags and a single release ships mismatched engines. Set the LLAMA_BUILD repository
# variable (Settings -> Actions -> Variables) to a tag like b10350 to pin all platforms at once; leave it
# unset and the script falls back to its DEFAULT_LLAMA_BUILD constant.
env:
  LLAMA_BUILD: ${{ vars.LLAMA_BUILD }}

jobs:
  build-macos-x64:
    name: Build macOS x64 (unsigned .dmg, cross-compiled on arm64)
    runs-on: macos-14           # Apple Silicon; we cross-build x64 on it
    # Free macos-14 runners have ~7 GB RAM but the compile uses an 8 GB Node heap,
    # so it swaps and runs slowly (cross-compile under Rosetta is slower still).
    timeout-minutes: 240
    env:
      npm_config_arch: x64
      npm_config_target_arch: x64
      VSCODE_ARCH: x64
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rosetta 2 (to run x64 Node on Apple Silicon)
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Install x64 Node.js (matches .nvmrc, runs under Rosetta)
        run: |
          set -e
          NODE_VER="$(tr -d 'v[:space:]' < .nvmrc)"
          echo "Installing x64 Node v${NODE_VER}"
          curl -fsSL "https://nodejs.org/dist/v${NODE_VER}/node-v${NODE_VER}-darwin-x64.tar.gz" -o /tmp/node-x64.tar.gz
          sudo mkdir -p /usr/local/node-x64
          sudo tar -xzf /tmp/node-x64.tar.gz -C /usr/local/node-x64 --strip-components=1
          echo "/usr/local/node-x64/bin" >> "$GITHUB_PATH"

      - name: Verify Node is x64
        run: |
          set -e
          which node
          node -v
          test "$(node -p process.arch)" = "x64" || { echo "Node is not x64!"; exit 1; }

      - name: Fetch llama.cpp engine binary (darwin-x64)
        run: node scripts/fetch-llama-binaries.mjs darwin-x64

      - name: Fetch embedding model
        run: node scripts/fetch-embedding-model.mjs

      - name: Install dependencies (npm ci, with retries)
        run: |
          set -e
          for i in 1 2 3 4 5; do
            npm ci && break
            if [ $i -eq 5 ]; then echo "npm ci failed 5x" >&2; exit 1; fi
            echo "npm ci attempt $i failed, retrying..."; sleep 5
          done

      - name: Build app (vscode-darwin-x64-min)
        run: npm run gulp vscode-darwin-x64-min

      - name: Create .dmg (unsigned, canonical name)
        run: |
          set -e
          mkdir -p dist dmgroot
          cp -R ../LoCoPilot-darwin-x64/LoCoPilot.app dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "LoCoPilot" -srcfolder dmgroot -ov -format UDZO \
            dist/LoCoPilot-darwin-x64.dmg
          ls -la dist

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: locopilot-macos-x64
          path: dist/*
          if-no-files-found: error
