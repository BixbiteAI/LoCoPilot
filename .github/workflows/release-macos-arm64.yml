# Builds LoCoPilot for macOS Apple Silicon (arm64) on a GitHub-hosted arm64 mac.
# Produces an UNSIGNED .app, zipped. Signing/notarization/DMG is a later phase
# (needs Apple cert secrets). Mirrors Docs/BUILD_COMMANDS.md §2.
name: Build macOS arm64

# Manual trigger only. See Docs/CI_BUILDS.md.
#   gh workflow run "Build macOS arm64" --repo BixbiteAI/LoCoPilot --ref main
on:
  workflow_dispatch:

jobs:
  build-macos-arm64:
    name: Build macOS arm64 (unsigned .app zip)
    runs-on: macos-14           # Apple Silicon runner
    timeout-minutes: 120
    env:
      npm_config_arch: arm64
      VSCODE_ARCH: arm64
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Fetch llama.cpp engine binary (darwin-arm64)
        run: node scripts/fetch-llama-binaries.mjs darwin-arm64

      - name: Fetch MLX runtime (arm64 only, best-effort)
        continue-on-error: true
        run: node scripts/fetch-mlx-runtime.mjs

      - name: Fetch embedding model
        run: node scripts/fetch-embedding-model.mjs

      - name: Install dependencies (npm ci, with retries)
        run: |
          set -e
          for i in 1 2 3 4 5; do
            npm ci && break
            if [ $i -eq 5 ]; then echo "npm ci failed 5x" >&2; exit 1; fi
            echo "npm ci attempt $i failed, retrying..."; sleep 5
          done

      - name: Build app (vscode-darwin-arm64-min)
        run: npm run gulp vscode-darwin-arm64-min

      - name: Zip the .app (unsigned)
        run: |
          set -e
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            ../LoCoPilot-darwin-arm64/LoCoPilot.app \
            dist/LoCoPilot-darwin-arm64.zip
          ls -la dist

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: locopilot-macos-arm64
          path: dist/*
          if-no-files-found: error
