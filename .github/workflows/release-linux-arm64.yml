# Builds the LoCoPilot Linux arm64 installers (.deb + .rpm) on a GitHub-hosted
# arm64 runner. Unsigned. Artifacts are uploaded to the run.
#
# NOTE: there is no official prebuilt llama.cpp arm64 Linux binary (see
# scripts/fetch-llama-binaries.mjs). The engine-fetch step is therefore
# best-effort and non-fatal: the app still builds, but bundled local-model
# inference won't work on arm64 Linux until an engine binary is provided in
# resources/bin/linux-arm64/. Everything else mirrors the linux-x64 workflow.
name: Build Linux arm64

# Manual trigger only. See Docs/CI_BUILDS.md.
#   gh workflow run "Build Linux arm64" --repo BixbiteAI/LoCoPilot --ref main
on:
  workflow_dispatch:

jobs:
  build-linux-arm64:
    name: Build Linux arm64 (.deb + .rpm)
    runs-on: ubuntu-24.04-arm     # GitHub-hosted arm64 Linux runner
    # arm64 runners are slower; the compile step can run ~2h. Give generous
    # headroom so runner-speed variance doesn't cancel a good build.
    timeout-minutes: 240
    env:
      npm_config_arch: arm64
      VSCODE_ARCH: arm64
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
            /usr/local/lib/node_modules 2>/dev/null || true
          df -h /

      - name: Add swap (avoids OOM "Killed")
        run: |
          set -e
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install system build dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            build-essential fakeroot rpm \
            libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev \
            libgtk-3-0 libgbm1 python3 pkg-config

      - name: Fetch llama.cpp engine binary (linux-arm64, best-effort)
        continue-on-error: true
        run: |
          node scripts/fetch-llama-binaries.mjs linux-arm64 \
            || echo "::warning::No prebuilt llama.cpp arm64 Linux binary; building without bundled engine."

      - name: Fetch embedding model
        run: node scripts/fetch-embedding-model.mjs

      - name: Install dependencies (npm ci, with retries)
        run: |
          set -e
          for i in 1 2 3 4 5; do
            npm ci && break
            if [ $i -eq 5 ]; then echo "npm ci failed 5x" >&2; exit 1; fi
            echo "npm ci attempt $i failed, retrying..."; sleep 5
          done

      - name: Build app folder (vscode-linux-arm64-min)
        run: npm run gulp vscode-linux-arm64-min

      - name: Sanity check — app folder produced
        run: |
          set -e
          ls -la ../LoCoPilot-linux-arm64/resources/app/node_modules >/dev/null
          echo "OK: app folder built"

      - name: Prune foreign-arch native bindings before packaging
        run: |
          set -e
          APP=../LoCoPilot-linux-arm64/resources/app/node_modules
          ORT="$APP/onnxruntime-node/bin/napi-v3"
          if [ -d "$ORT" ]; then
            rm -rf "$ORT/darwin" "$ORT/win32" "$ORT/linux/x64" 2>/dev/null || true
          fi
          # Generic safety net: remove any non-aarch64 .node binary.
          removed=0
          while IFS= read -r f; do
            if ! file -b "$f" | grep -qi 'aarch64\|arm64'; then
              echo "Removing foreign-arch binding: $f"
              rm -f "$f"; removed=$((removed+1))
            fi
          done < <(find "$APP" -name '*.node')
          echo "Pruned $removed foreign-arch .node file(s)."

      - name: Package .deb + .rpm (arm64)
        run: |
          set -e
          npm run gulp vscode-linux-arm64-prepare-deb
          npm run gulp vscode-linux-arm64-build-deb
          npm run gulp vscode-linux-arm64-prepare-rpm
          npm run gulp vscode-linux-arm64-build-rpm

      - name: Collect artifacts (canonical names)
        run: |
          set -e
          mkdir -p dist
          tar -czf dist/LoCoPilot-linux-arm64.tar.gz -C .. LoCoPilot-linux-arm64
          cp -v "$(find .build/linux -name '*.deb' | head -1)" dist/LoCoPilot-linux-arm64.deb
          cp -v "$(find .build/linux -name '*.rpm' | head -1)" dist/LoCoPilot-linux-arm64.rpm
          ls -la dist

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: locopilot-linux-arm64
          path: dist/*
          if-no-files-found: error
